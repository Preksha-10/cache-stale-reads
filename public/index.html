<!-- public/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Items Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; }
    .item { display:flex; justify-content:space-between; padding:8px 12px; border:1px solid #ddd; border-radius:6px; margin-bottom:8px; }
    #log { background:#111; color:#0f0; font-family:monospace; font-size:12px; height:180px; overflow-y:auto; padding:8px; border-radius:6px; }
    select, button, input { padding:6px 10px; margin-right:8px; }
  </style>
</head>
<body>
  <h1>Items Dashboard</h1>

  <label>User:
    <select id="userSelect">
      <option value="user-1">user-1</option>
      <option value="user-2">user-2</option>
    </select>
  </label>
  <button id="refreshBtn">Refresh list</button>

  <div id="list"></div>

  <h3>Update item</h3>
  <input id="itemId" placeholder="item id (e.g. a1)" />
  <input id="itemValue" placeholder="new value" type="number" />
  <button id="updateBtn">Update</button>

  <h3>Cache log</h3>
  <div id="log"></div>

  <script type="module" src="./dist/frontend/main.js"></script>
</body>
</html>
